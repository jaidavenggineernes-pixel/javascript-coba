<!DOCTYPE html>
<html lang="id">
<head>
    <title>Perulangan</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: #eee;
            padding: 30px;
        }

        .box {
            background: white;
            padding: 20px;
            max-width: 350px;
            margin: auto;
            border-radius: 10px;
        }

        button {
            padding: 10px 20px;
            background: blue;
            color: white;
            border: none;
            cursor: pointer;
        }

        #hasil {
            margin-top: 20px;
            line-height: 1.8;
        }
    </style>
</head>
<body>

    <div class="box">
        <h2>Perulangan For</h2>
        <p>Klik tombol untuk menampilkan angka 1-10.</p>

        <button onclick="ulangi(10)">Tampilkan</button>

        <div id="hasil"></div>
    </div>

    <script>
        function ulangi(n) {
            let teks = "";

            for (let i = 1; i <= n; i++) {
                teks += i + "<br>";
            }

            document.getElementById("hasil").innerHTML = teks;
        }
    </script>

</body>
</html>
